<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="statsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7608AA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#5a0688;stop-opacity:1" />
        </linearGradient>
        <filter id="statsShadow">
            <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
        </filter>
    </defs>
    <circle cx="40" cy="40" r="36" fill="url(#statsGrad)" filter="url(#statsShadow)"/>
    <!-- Гистограмма статистики -->
    <rect x="18" y="45" width="10" height="18" fill="#fff" rx="2"/>
    <rect x="33" y="35" width="10" height="28" fill="#fff" rx="2"/>
    <rect x="48" y="25" width="10" height="38" fill="#fff" rx="2"/>
    <!-- Линия тренда -->
    <path d="M20 50 L35 40 L50 30 L62 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Точки на линии -->
    <circle cx="20" cy="50" r="2" fill="#fff"/>
    <circle cx="35" cy="40" r="2" fill="#fff"/>
    <circle cx="50" cy="30" r="2" fill="#fff"/>
    <circle cx="62" cy="22" r="2" fill="#fff"/>
</svg>
