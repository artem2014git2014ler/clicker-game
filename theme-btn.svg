    <circle cx="50" cy="35" r="12" fill="url(#themeGrad)"/>
    <!-- Лучи -->
    <g stroke="#fff" stroke-width="2.5" stroke-linecap="round">
        <line x1="40" y1="18" x2="40" y2="10"/>
        <line x1="40" y1="70" x2="40" y2="62"/>
        <line x1="18" y1="40" x2="10" y2="40"/>
        <line x1="70" y1="40" x2="62" y2="40"/>
        <line x1="24.5" y1="24.5" x2="18.8" y2="18.8"/>
        <line x1="61.2" y1="61.2" x2="55.5" y2="55.5"/>
        <line x1="24.5" y1="55.5" x2="18.8" y2="61.2"/>
        <line x1="61.2" y1="18.8" x2="55.5" y2="24.5"/>
    </g>
</svg>
